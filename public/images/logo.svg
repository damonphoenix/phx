<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none">
  <style>
    .moon { fill: #f5e040; }
    .sun  { fill: #1a1a1a; }

    /* Standalone SVG: respect OS preference */
    @media (prefers-color-scheme: dark) {
      .sun  { fill: #ffffff; }
      .moon { fill: #f5e040; }
    }

    /* Inline in HTML: respect data-theme on <html> */
    :root[data-theme="dark"]  .sun  { fill: #ffffff; }
    :root[data-theme="light"] .sun  { fill: #1a1a1a; }
  </style>

  <!-- Moon: slightly lower-left, creates the crescent -->
  <circle class="moon" cx="44" cy="56" r="42"/>
  <!-- Sun: on top, offset upper-right -->
  <circle class="sun"  cx="56" cy="44" r="40"/>
</svg>
